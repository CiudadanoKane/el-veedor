<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Veedor: Veeduría Fácil</title>

    <!-- SVG con media query interna: el ícono se adapta al tema del sistema
         (negro en tema claro, blanco en oscuro). El PNG queda de respaldo
         para navegadores que no admiten favicon en SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icono-el-veedor.png" />
    <link rel="apple-touch-icon" href="/icono-el-veedor.png" />
    <meta name="theme-color" content="#1A1A18" />

    <!-- "SECOP" y no "SECOP II": la plataforma lee los dos sistemas. Estas dos
         descripciones son además lo que se lee cuando alguien comparte el
         enlace, así que son el sitio donde una fuente mal declarada llega más
         lejos. -->
    <meta name="description" content="Plataforma de veeduría ciudadana de la contratación pública colombiana. Datos abiertos de SECOP I y II convertidos en señales que cualquier persona puede entender." />

    <!-- Vista previa al compartir el enlace: es lo primero que ve quien recibe
         la plataforma por un chat. Dirección COMPLETA en la imagen —WhatsApp y
         Facebook ignoran una ruta relativa como "/logo.png"— y una imagen
         apaisada (1200x630) con fondo propio: el logo negro transparente que
         había antes desaparecía sobre el fondo oscuro de WhatsApp. Sin og:url:
         es la misma página para todas las rutas, y una og:url fija haría que
         Facebook tratara un enlace a un perfil como si fuera la portada. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Veedor" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="El Veedor: Veeduría Fácil" />
    <meta property="og:description" content="Datos abiertos de SECOP I y II convertidos en señales que cualquier persona puede entender. La plataforma señala patrones, no acusa." />
    <meta property="og:image" content="https://el-veedor.vercel.app/og-el-veedor.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="El Veedor, veeduría fácil: la contratación pública de Colombia en señales que cualquiera puede leer." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://el-veedor.vercel.app/og-el-veedor.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
