name: Recalcular adiciones de valor

# Las adiciones de valor no se pueden calcular en vivo: exigen cruzar el
# dataset de Contratos con el de Procesos contrato a contrato, y SoQL no puede
# unir dos datasets dentro de un GROUP BY. Ver el encabezado de
# scripts/calcular-adiciones.mjs. Por eso se precalculan una vez al día y el
# resultado (public/adiciones.json) se sirve como archivo estático.

on:
  schedule:
    # 07:40 UTC = 02:40 en Colombia, después de la actualización diaria de SECOP
    # y antes de que haya tráfico.
    - cron: '40 7 * * *'
  # Permite recalcular a mano desde la pestaña Actions.
  workflow_dispatch:

# Necesario para que el bot pueda commitear el JSON recalculado.
permissions:
  contents: write

concurrency:
  group: adiciones
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    # Suele terminar en 10-18 min; el margen holgado es para los días en que la
    # API de datos.gov.co está lenta (pasa), no para el caso normal.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verificar el token
        # Sin token la API estrangula la tasa y el recorrido de 5,4 millones de
        # contratos se arrastra hasta agotar el tiempo. Falla en 1 segundo con un
        # mensaje claro, en vez de en 60 minutos con uno ambiguo.
        env:
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_TOKEN }}
        run: |
          if [ -z "$SOCRATA_TOKEN" ]; then
            echo "::error::Falta el secreto SOCRATA_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Calcular adiciones
        env:
          SOCRATA_BASE: https://www.datos.gov.co/resource
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_TOKEN }}
        # El heap se acota a 4 GB: los runners de GitHub tienen 7 GB, y dejar que
        # Node crezca hasta 6 empuja la máquina al swap —el working set real ronda
        # 1-1,5 GB, así que 4 sobra y evita el thrashing que disparaba el tiempo.
        run: node --max-old-space-size=4096 scripts/calcular-adiciones.mjs

      - name: Commitear si cambió
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # El nacional y la carpeta de tops por ámbito (departamento y
          # municipio), que salen del mismo recorrido. Si solo se commiteara el
          # primero, el ranking por ámbito se quedaría congelado sin que nadie
          # lo notara.
          #
          # `git add` ANTES de comprobar, y `--porcelain` sobre el índice en vez
          # de `git diff --quiet`: la carpeta se rehace entera en cada corrida,
          # así que puede haber ámbitos NUEVOS —archivos sin seguimiento, que
          # `git diff` no ve— y ámbitos que desaparecieron. Con la comprobación
          # anterior, una corrida que solo añadiera municipios se habría dado por
          # "sin cambios".
          git add -A public/adiciones.json public/adiciones-ambitos
          if [ -z "$(git status --porcelain -- public/adiciones.json public/adiciones-ambitos)" ]; then
            echo 'Sin cambios en las adiciones.'
            exit 0
          fi
          git commit -m 'Datos: recalcula adiciones de valor'
          # Traer lo que otros recálculos hayan subido mientras este corría y
          # reintentar. Los cron de GitHub llegan con más de una hora de retraso, así
          # que los tres terminan coincidiendo aunque estén escalonados; con un
          # `git push` solo, el que llegaba segundo era rechazado y su archivo se
          # perdía (oct 2026: el ranking de contratistas, dos días seguidos). Cada
          # workflow toca un archivo distinto, así que el rebase no choca.
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((intento * 5))
          done
          exit 1
